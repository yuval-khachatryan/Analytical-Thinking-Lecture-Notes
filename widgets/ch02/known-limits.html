<!doctype html>
<html lang="he" dir="rtl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>משפחות של גבולות</title>
<style>
body{margin:0;font:15px/1.5 Arial,sans-serif;color:#1f2937;background:transparent}
.w{padding:.6rem;border:1px solid #cbd5e1;background:white;border-radius:8px}
canvas{display:block;width:100%;height:auto}.controls{display:flex;align-items:center;flex-wrap:wrap;gap:.4rem .8rem}
label{display:inline-flex;align-items:center;gap:.4rem}input{direction:ltr;width:10rem}select{font:inherit;padding:.15rem;border:1px solid #94a3b8;border-radius:4px}
.m{direction:ltr;unicode-bidi:isolate;display:inline-block;font:17px 'Cambria Math','Times New Roman',serif}
.formula{text-align:center}.fr{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.2}.fr>span:first-child{border-bottom:1px solid}
.root{border-top:1px solid;padding-inline:.15em}.note{margin:.3rem 0 0;color:#475569;font-size:.9rem}[hidden]{display:none!important}
</style>
<div class="w">
  <div class="formula m" id="formula" style="display:block"></div>
  <canvas id="plot" width="760" height="270" aria-label="איברי הסדרה והגבול"></canvas>
  <div class="controls">
    <label id="q-control">הבסיס <span class="m">q</span><input id="q" type="range"><output class="m" id="q-value"></output></label>
    <label id="a-control">המספר הקבוע <span class="m">a</span><select id="a"><option value="0.25">¼</option><option value="2">2</option><option value="4" selected>4</option><option value="16">16</option></select></label>
    <label id="p-control">המעריך <span class="m">p</span><select id="p"><option>1</option><option>2</option><option>3</option></select></label>
    <label>מספר האיברים<select id="count"><option>12</option><option selected>24</option><option>48</option><option>96</option><option>192</option></select></label>
  </div>
  <p class="note" id="readout" aria-live="polite"></p>
</div>
<script src="../shared/autosize.js"></script>
<script>
(function(){
  'use strict';
  var kind=new URLSearchParams(location.search).get('case')||'geometric';
  if(['geometric','roots','ratio'].indexOf(kind)<0)kind='geometric';
  var cv=document.getElementById('plot'),ctx=cv.getContext('2d'),q=document.getElementById('q'),a=document.getElementById('a'),p=document.getElementById('p'),count=document.getElementById('count');
  document.getElementById('q-control').hidden=kind==='roots';
  document.getElementById('a-control').hidden=kind!=='roots';
  document.getElementById('p-control').hidden=kind!=='ratio';
  q.min=kind==='ratio'?'1.2':'-1.2';q.max=kind==='ratio'?'4':'1.2';q.step='0.1';q.value=kind==='ratio'?'2':'0.5';
  function family(kind,q,a,p){
    if(kind==='roots')return {term:function(n){return Math.pow(a,1/n);},limit:1,note:'המספר שמתחת לשורש קבוע; סדר השורש גדל.'};
    if(kind==='ratio')return {term:function(n){return Math.pow(n,p)/Math.pow(q,n);},limit:0,note:'המנה יכולה לגדול בתחילה. הגדילו את מספר האיברים כדי לראות את ההמשך.'};
    var converges=Math.abs(q)<1||q===1;
    return {term:function(n){return Math.pow(q,n);},limit:converges?(q===1?1:0):null,note:q===0?'כל האיברים שווים לאפס.':Math.abs(q)<1?'הערך המוחלט קטן בכל צעד. בסיס שלילי גורם גם לחילופי סימן.':q===1?'כל האיברים שווים לאחת: הגבול הוא אחת, ולא אפס.':q===-1?'האיברים מתחלפים בין אחת למינוס אחת: אין גבול.':'הערכים המוחלטים גדלים: הסדרה אינה מתכנסת למספר.'};
  }
  function number(value){return Math.abs(value)>=10000?value.toExponential(1):Number(value.toPrecision(3)).toString();}
  function text(s,x,y,align,color){ctx.direction='ltr';ctx.font='12px Arial';ctx.textAlign=align||'center';ctx.textBaseline='middle';ctx.fillStyle=color||'#475569';ctx.fillText(s,x,y);}
  function draw(){
    var base=Number(q.value),constant=Number(a.value),power=Number(p.value),N=Number(count.value),S=family(kind,base,constant,power);
    var values=Array.from({length:N},function(_,i){return S.term(i+1);}),target=S.limit===null?0:S.limit;
    var lo=Math.min.apply(null,[target,0].concat(values)),hi=Math.max.apply(null,[target,0].concat(values)),span=Math.max(hi-lo,.2);
    lo-=span*.08;hi+=span*.12;
    var left=64,right=18,top=18,bottom=35,W=cv.width,H=cv.height;
    function X(n){return left+(n-.5)/N*(W-left-right);}
    function Y(v){return top+(hi-v)/(hi-lo)*(H-top-bottom);}
    ctx.clearRect(0,0,W,H);ctx.strokeStyle='#94a3b8';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(left,top);ctx.lineTo(left,H-bottom);ctx.lineTo(W-right,H-bottom);ctx.stroke();
    for(var j=0;j<=4;j++){var value=lo+j*(hi-lo)/4;text(number(value),left-7,Y(value),'right');}
    var tick=N<=24?1:N<=48?5:N<=96?10:20;
    for(var n=1;n<=N;n++)if(n===1||n%tick===0){ctx.beginPath();ctx.moveTo(X(n),H-bottom);ctx.lineTo(X(n),H-bottom+4);ctx.stroke();text(String(n),X(n),H-bottom+15);}
    text('n',W-right,H-8,'right');
    if(S.limit!==null){ctx.strokeStyle='#64748b';ctx.setLineDash([5,4]);ctx.beginPath();ctx.moveTo(left,Y(target));ctx.lineTo(W-right,Y(target));ctx.stroke();ctx.setLineDash([]);text('L = '+target,W-right-5,Y(target)-10,'right','#4338ca');}
    ctx.fillStyle='#4f46e5';values.forEach(function(value,i){ctx.beginPath();ctx.arc(X(i+1),Y(value),N>96?2:3.2,0,2*Math.PI);ctx.fill();});
    document.getElementById('q-value').textContent=String(base);
    var expression=kind==='geometric'?(base<0?'('+base+')':base)+'<sup><i>n</i></sup>':kind==='roots'?'<sup><i>n</i></sup>√<span class="root">'+constant+'</span>':'<span class="fr"><span><i>n</i>'+(power===1?'':'<sup>'+power+'</sup>')+'</span><span>'+base+'<sup><i>n</i></sup></span></span>';
    document.getElementById('formula').innerHTML='<i>a</i><sub><i>n</i></sub> = '+expression+(S.limit===null?'':' → '+S.limit);
    document.getElementById('readout').innerHTML=S.note+' באינדקס <span class="m">n = '+N+'</span> מתקבל <span class="m">a<sub>'+N+'</sub> ≈ '+Number(values[N-1].toPrecision(4))+'</span>. הציור מציג רק מספר סופי של איברים.';
  }
  [q,a,p,count].forEach(function(control){control.addEventListener('input',draw);control.addEventListener('change',draw);});draw();
})();
</script>
</html>
