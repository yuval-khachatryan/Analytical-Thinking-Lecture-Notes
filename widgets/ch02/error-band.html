<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>שגיאה מותרת ורצועה סביב הגבול</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  body { font: 15px/1.45 Arial, "Helvetica Neue", sans-serif; color: #1f2937; }
  .w { border: 1px solid #9ca3af; background: #fff; padding: 0.7rem 0.8rem 0.9rem; }
  canvas { display: block; width: 100%; height: auto; }
  .row { display: flex; align-items: center; flex-wrap: wrap; gap: 0.5rem 0.9rem; margin-top: 0.55rem; }
  .row input[type=range] { flex: 1 1 220px; direction: ltr; }
  /* math typeset in plain HTML: italic variables, real fractions, superscripts */
  .m, .opt .f { direction: ltr; unicode-bidi: isolate; font: 17px "Cambria Math", "Times New Roman", serif; }
  .fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: .9em; line-height: 1.1; margin: 0 .1em; }
  .fr > span:first-child { border-bottom: 1px solid currentColor; padding: 0 .15em; }
  .opts { display: flex; flex-wrap: wrap; gap: .4rem; }
  .opt { display: inline-flex; align-items: center; gap: .3rem; padding: .2rem .6rem; border: 1px solid #cbd5e1; border-radius: 8px; cursor: pointer; background: #fff; }
  .opt:has(input:checked) { border-color: #4f46e5; background: #eef2ff; }
  .opt input { margin: 0; }
  .now { text-align: center; margin-bottom: .2rem; }
  .m { direction: ltr; unicode-bidi: isolate; display: inline-block; font: 16px "Cambria Math", "Times New Roman", serif; }
  .read { padding: .35rem .6rem; border-radius: 8px; background: #f8fafc; border: 1px solid #e2e8f0; }
  .read.good { background: #f0fdf4; border-color: #bbf7d0; }
  .read.bad { background: #fff1f2; border-color: #fecdd3; }
  button, input[type=number] { font: inherit; padding: .2rem .45rem; border: 1px solid #94a3b8; border-radius: 6px; background: white; }
  input[type=number] { width: 6rem; direction: ltr; }
  .caption { margin: .4rem 0 0; font-size: .83rem; color: #475569; }
</style>
</head>
<body>
<div class="w">
  <div class="now"><span class="m" id="now"></span> <span id="lim"></span></div>
  <canvas id="cv" width="780" height="300"></canvas>
  <div class="row" role="radiogroup" aria-label="הסדרה">
    <span>הסדרה:</span>
    <div class="opts" id="opts"></div>
  </div>
  <div class="row">
    <label for="eps">השגיאה המותרת <span class="m">ε</span>:</label>
    <input type="range" id="eps" min="0" max="6" step="1" value="1" aria-label="epsilon">
    <span class="m" id="epsval"></span>
  </div>
  <div class="row">
    <label for="tail-index">אינדקס שממנו כל האיברים ברצועה: <span class="m">N</span></label>
    <input id="tail-index" type="number" min="1" step="1" aria-label="האינדקס N">
    <button id="check-tail" type="button">בדיקה</button>
    <button id="suggest-tail" type="button">הצעת אינדקס</button>
  </div>
  <div class="row read" id="read" aria-live="polite">בחרו אינדקס ובדקו. אין צורך באינדקס הקטן ביותר.</div>
  <p class="caption" id="zoom-caption"></p>
</div>
<script src="../shared/autosize.js"></script>
<script>
(function () {
  "use strict";
  var cv = document.getElementById("cv"), ctx = cv.getContext("2d");
  var W = cv.width, H = cv.height, PADL = 64, PADR = 16, PADT = 16, PADB = 34;
  var EPS = [0.5, 0.2, 0.1, 0.05, 0.02, 0.01, 0.005];
  // L: the limit (null: the sequence diverges; then the band is drawn around `around`)
  function fr(a, b) { return "<span class='fr'><span>" + a + "</span><span>" + b + "</span></span>"; }
  var N_ = "<i>n</i>", POW = "(−1)<sup><i>n</i></sup>";
  var SEQS = [
    { f: function (n) { return 1 / n; }, L: 0, bound: 1, error: function(n){return 1/n;}, html: fr("1", N_), lo: -0.15, hi: 1.05 },
    { f: function (n) { return (n + 2) / n; }, L: 1, bound: 2, error: function(n){return 2/n;}, html: fr(N_ + " + 2", N_), lo: 0.85, hi: 3.05 },
    { f: function (n) { return (n % 2 ? -1 : 1) / n; }, L: 0, bound: 1, error: function(n){return 1/n;}, html: fr(POW, N_), lo: -1.05, hi: 0.6 },
    { f: function (n) { return 1 + Math.sin(n) / n; }, L: 1, bound: 1, error: function(n){return Math.abs(Math.sin(n))/n;}, html: "1 + " + fr("sin " + N_, N_), lo: 0.55, hi: 1.9 },
    { f: function (n) { return n % 2 ? -1 : 1; }, L: null, around: 1, html: POW, lo: -1.3, hi: 1.3 }
  ];
  var opts = document.getElementById("opts");
  SEQS.forEach(function (S, i) {
    var lab = document.createElement("label"); lab.className = "opt";
    lab.innerHTML = "<input type='radio' name='seq' value='" + i + "'" + (i ? "" : " checked") + "><span class='f'>" + S.html + "</span>";
    opts.appendChild(lab);
  });
  var sel = { get value() { return document.querySelector("input[name=seq]:checked").value; } };
  var slider = document.getElementById("eps");
  var read = document.getElementById("read"), epsval = document.getElementById("epsval"), limEl = document.getElementById("lim");
  var tailInput=document.getElementById("tail-index");
  // The analytic bound error(n) <= bound/n guarantees the entire remaining tail.
  function sufficientN(S,e) { return S.L===null?null:Math.floor(S.bound/e)+1; }
  function firstOutside(S,e,N) {
    if(S.L===null)return N%2?N:N+1;
    var safe=sufficientN(S,e);
    for(var n=N;n<safe;n++)if(S.error(n)>=e)return n;
    return null;
  }
  function checkTail() {
    var S=SEQS[+sel.value],e=EPS[+slider.value],N=Number(tailInput.value);
    if(!tailInput.value||!Number.isSafeInteger(N)||N<1){read.className="row read";read.textContent="כתבו אינדקס טבעי: 1, 2, 3 וכן הלאה.";return;}
    var outside=firstOutside(S,e,N);
    read.className="row read "+(outside===null?"good":"bad");
    read.innerHTML=outside===null
      ?"<span>✓ מתאים! לכל <span class='m'>n ≥ "+N+"</span> השגיאה קטנה מ <span class='m'>"+e+"</span>. גם אינדקס גדול יותר יתאים.</span>"
      :"<span>לא מתאים: גם באינדקס <span class='m'>n = "+outside+"</span> השגיאה אינה קטנה מ <span class='m'>"+e+"</span>."+(S.L===null?" כאן תמיד יופיעו שוב איברים השווים למינוס אחת, ולכן אין אינדקס מתאים.":" בחרו אינדקס גדול יותר.")+"</span>";
    draw();
  }
  function text(s, x, y, color, align, base, font) {
    ctx.fillStyle = color || "#334155"; ctx.direction = "ltr"; ctx.font = font || "13px Arial";
    ctx.textAlign = align || "center"; ctx.textBaseline = base || "middle"; ctx.fillText(s, x, y);
  }
  function draw() {
    var S = SEQS[+sel.value], e = EPS[+slider.value], safe = sufficientN(S, e), N = Number(tailInput.value);
    if(!Number.isSafeInteger(N)||N<1)N=null;
    var center = S.L === null ? S.around : S.L;
    var nMax = Math.max(30, safe ? Math.ceil(safe * 1.6) : 40);
    var lo=S.L===null?S.lo:center-2.5*e,hi=S.L===null?S.hi:center+2.5*e;
    function X(n) { return PADL + (n - 0.5) / nMax * (W - PADL - PADR); }
    function Y(v) { return PADT + (hi - v) / (hi - lo) * (H - PADT - PADB); }
    ctx.clearRect(0, 0, W, H);
    // the band (at least 2px, so a small error stays visible)
    var y1 = Y(center + e), y2 = Y(center - e);
    if (y2 - y1 < 2) { var mid = (y1 + y2) / 2; y1 = mid - 1; y2 = mid + 1; }
    ctx.fillStyle = "rgba(79,70,229,.12)"; ctx.fillRect(PADL, y1, W - PADL - PADR, y2 - y1);
    ctx.strokeStyle = "#4f46e5"; ctx.lineWidth = 1; ctx.setLineDash([5, 4]);
    [y1, y2].forEach(function (y) { ctx.beginPath(); ctx.moveTo(PADL, y); ctx.lineTo(W - PADR, y); ctx.stroke(); });
    ctx.setLineDash([]);
    ctx.strokeStyle = "#4f46e5"; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(PADL, Y(center)); ctx.lineTo(W - PADR, Y(center)); ctx.stroke();
    text((S.L === null ? "" : "L = ") + center, PADL - 6, Y(center), "#4338ca", "right", "middle", "bold 13px Arial");
    // axes
    ctx.strokeStyle = "#0f172a"; ctx.lineWidth = 1.1;
    ctx.beginPath(); ctx.moveTo(PADL, PADT); ctx.lineTo(PADL, H - PADB); ctx.lineTo(W - PADR, H - PADB); ctx.stroke();
    var step = nMax <= 40 ? 5 : nMax <= 100 ? 10 : nMax <= 200 ? 20 : 50;
    for (var t = step; t <= nMax; t += step) {
      ctx.beginPath(); ctx.moveTo(X(t), H - PADB); ctx.lineTo(X(t), H - PADB + 4); ctx.stroke();
      text(String(t), X(t), H - PADB + 14, "#475569");
    }
    text("n", W - PADR, H - PADB + 26, "#334155", "right", "middle", "italic 14px 'Cambria Math', serif");
    [center-e,center+e].forEach(function(v){
      text(Number(v.toPrecision(5)).toString(),PADL-6,Y(v),"#475569","right");
    });
    // The student's proposed starting index, when it is within the displayed range.
    if (N && N<=nMax) {
      var nColor=firstOutside(S,e,N)===null?"#15803d":"#dc2626";
      ctx.strokeStyle = nColor; ctx.lineWidth = 1.5; ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.moveTo(X(N) - 0.5 * (X(2) - X(1)), PADT); ctx.lineTo(X(N) - 0.5 * (X(2) - X(1)), H - PADB); ctx.stroke();
      ctx.setLineDash([]);
      text("N = " + N, X(N) + 4, PADT + 6, nColor, "left", "top", "bold 13px Arial");
    }
    // the terms: inside the band blue, outside red
    var r = nMax > 150 ? 2 : nMax > 60 ? 2.8 : 3.8;
    for (var n = 1; n <= nMax; n++) {
      var v = S.f(n), inside = S.L===null?Math.abs(v-center)<e:S.error(n)<e;
      if(v<lo||v>hi)continue;
      ctx.fillStyle = inside ? "#1d4ed8" : "#dc2626";
      ctx.beginPath(); ctx.arc(X(n), Y(v), r, 0, 2 * Math.PI); ctx.fill();
    }
    epsval.textContent = "ε = " + e;
    document.getElementById("now").innerHTML = "<i>a</i><sub><i>n</i></sub> = " + S.html;
    limEl.innerHTML = S.L === null ? "<span>(אין לה גבול)</span>" : "<span>(הגבול: <span class='m'><i>L</i> = " + S.L + "</span>)</span>";
    document.getElementById("zoom-caption").textContent=S.L===null
      ?"מוצגים שני הערכים שהסדרה חוזרת אליהם. הבדיקה כוללת גם את האיברים שאינם מוצגים בציור."
      :"הציור מתמקד בסביבת הגבול ומתקרב אליה כשמקטינים את השגיאה המותרת. איברים שמחוץ לטווח האנכי אינם מוצגים. הבדיקה כוללת גם את האיברים שאינם מוצגים בציור.";
  }
  function changed(){read.className="row read";read.textContent="בחרו אינדקס ובדקו. אין צורך באינדקס הקטן ביותר.";draw();}
  opts.addEventListener("change",changed);
  slider.addEventListener("input",changed);
  tailInput.addEventListener("input",changed);
  tailInput.addEventListener("keydown",function(event){if(event.key==="Enter")checkTail();});
  document.getElementById("check-tail").addEventListener("click",checkTail);
  document.getElementById("suggest-tail").addEventListener("click",function(){
    var N=sufficientN(SEQS[+sel.value],EPS[+slider.value]);
    if(N===null){read.className="row read bad";read.textContent="אין אינדקס מתאים: האיברים השווים למינוס אחת ממשיכים להופיע מחוץ לרצועה.";return;}
    tailInput.value=String(N);checkTail();
  });
  draw();
})();
</script>
</body>
</html>
