<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ε והאינדקס N</title>
<link rel="stylesheet" href="limit-activities.css">
<link rel="stylesheet" href="error-band.css">
</head>
<body><div class="w error-band">
<p class="formula-line"><span class="m" id="formula"></span></p>
<div class="controls">
<label for="epsilon">בחירת <span class="m">ε</span></label>
<select id="epsilon" aria-label="בחירת ε"></select><div id="epsilon-options"></div>
<div class="cutoff" aria-live="polite">
<math dir="ltr"><mrow><mi>N</mi><mo>=</mo><mrow><mo stretchy="true">⌊</mo><mfrac><mn>1</mn><mi>ε</mi></mfrac><mo stretchy="true">⌋</mo></mrow><mo>+</mo><mn>1</mn><mo>=</mo><mn id="cutoff-value"></mn></mrow></math>
</div>
</div>
<p class="plot-guide">הקו האנכי מסמן את <span class="m">N</span>. כל הנקודות ממנו והלאה בתוך הרצועה; הנקודות שלפניו מוצגות בגוון חלש.</p>
<svg id="plot"></svg>
<p id="caption" class="caption"></p>
<div id="read" class="read" aria-live="polite"></div>
</div>
<script src="../shared/autosize.js"></script>
<script src="limit-activities.js"></script>
<script>
(function(){
'use strict';
var A=LimitActivities,$=function(id){return document.getElementById(id);},kind=new URLSearchParams(location.search).get('case')==='alternating-decay'?'alternating-decay':'reciprocal',eps=$('epsilon');
A.choices.slice(3).forEach(function(e){var o=document.createElement('option');o.value=e.join('/');o.textContent=A.plain(e[0],e[1]);eps.appendChild(o);});
eps.value='1/10';
function math(s){return '<span class="m">'+s+'</span>';}
function frac(p,q){return A.fraction(p,q);}
$('formula').innerHTML='a<sub>n</sub> = '+frac(kind==='reciprocal'?'1':'(−1)<sup>n</sup>','n')+' , &nbsp; lim<sub>n → ∞</sub> a<sub>n</sub> = 0';
function draw(){
 var e=eps.value.split('/').map(Number),N=Math.floor(e[1]/e[0])+1;
 $('cutoff-value').textContent=String(N);
 var v=A.plot($('plot'),kind,0,e,N,{focusTail:true});
 $('caption').textContent='מוצגים האינדקסים '+v.first+' עד '+v.last+'. התצוגה מתמקדת סביב N ומשנה קנה מידה בהתאם.';
 $('read').innerHTML='לכל '+math('n ≥ '+N)+':'+
  '<div class="calculation">'+math('|a<sub>n</sub> − 0| = '+frac(1,'n')+' ≤ '+frac(1,N)+' &lt; '+frac(e[0],e[1]))+'</div>'+
  'לכן כל האיברים החל מ '+math('N')+' בתוך הרצועה, גם מעבר לציור.';
}
eps.addEventListener('change',draw);
window.addEventListener('resize',draw);
A.fractionPicker(eps,$('epsilon-options'));
draw();
})();
</script>
</body></html>
