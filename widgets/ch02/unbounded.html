<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>יוצאים מכל חסם מוצע</title>
<link rel="stylesheet" href="limit-activities.css">
<style>
.bound-controls{display:grid;gap:.5rem;margin:.5rem 0}.bound-controls label{display:flex;align-items:center;flex-wrap:wrap;gap:.5rem}.bound-controls input{flex:1;min-width:8rem;max-width:20rem}.bound-controls output{min-width:3rem}.inside-key{color:#2563a6}.outside-key{color:#b72e46}.bound-read{border-inline-start:3px solid #b72e46}.bound-read.pending{border-color:#64748b;background:#f0f3f7;color:#243249}
</style>
</head>
<body><div class="w">
<div class="bound-controls">
<label>הסדרה <select id="sequence" dir="ltr" aria-label="בחירת סדרה"><option value="positive">aₙ = n</option><option value="negative">aₙ = −n</option></select></label>
<label><span class="m">M</span><input id="bound" type="range" min="0" max="20" step="1" value="5" aria-label="החסם המוצע M"><output id="bound-value" for="bound" class="m"></output></label>
<label><span class="m">N</span><input id="count" type="range" min="1" max="60" step="1" value="5" aria-label="מספר האיברים המוצגים N"><output id="count-value" for="count" class="m"></output></label>
</div>
<p class="legend"><span class="inside-key">● כחול: <span class="m">|a<sub>n</sub>| ≤ M</span></span> · <span class="outside-key">● אדום: <span class="m">|a<sub>n</sub>| &gt; M</span></span></p>
<svg id="plot" role="img"></svg>
<div id="read" class="read bound-read" aria-live="polite"></div>
<p class="caption">כאן בוחרים ערכים שלמים של <span class="m">M</span>. הסדרה ממשיכה מעבר לאיברים המוצגים.</p>
</div>
<script src="../shared/autosize.js"></script><script src="limit-activities.js"></script><script src="unbounded.js"></script>
</body></html>
