<line x1="450" x2="450" y1="84" y2="123" stroke="#b6a5d4" stroke-dasharray="3 4"/>
<text x="450" y="161" style="fill:#674a9a">a<tspan class="sub">6</tspan></text>
<text x="527" y="58" style="fill:#674a9a">a<tspan class="sub">7</tspan></text>
