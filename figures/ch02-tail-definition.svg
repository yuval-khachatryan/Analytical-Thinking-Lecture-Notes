<text class="he" x="654" y="156">הזנב</text>
<rect x="269" y="24" width="327" height="58" rx="9" fill="#eee8fb" stroke="#b6a5d4"/>
<rect x="269" y="127" width="327" height="58" rx="9" fill="#eee8fb" stroke="#b6a5d4"/>

<text x="65" y="58" style="fill:#8993a4">a<tspan class="sub">1</tspan></text>
<text x="142" y="58" style="fill:#8993a4">a<tspan class="sub">2</tspan></text>
<text x="219" y="58" style="fill:#8993a4">a<tspan class="sub">3</tspan></text>
<text x="296" y="58" style="fill:#674a9a">a<tspan class="sub">4</tspan></text>
<line x1="296" x2="296" y1="84" y2="123" stroke="#b6a5d4" stroke-dasharray="3 4"/>
<text x="296" y="161" style="fill:#674a9a">a<tspan class="sub">4</tspan></text>
<text x="373" y="58" style="fill:#674a9a">a<tspan class="sub">5</tspan></text>
<line x1="373" x2="373" y1="84" y2="123" stroke="#b6a5d4" stroke-dasharray="3 4"/>
<text x="373" y="161" style="fill:#674a9a">a<tspan class="sub">5</tspan></text>
