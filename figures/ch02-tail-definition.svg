<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" role="img" aria-labelledby="title desc">
<title id="title">The tail starting at index four</title>
<desc id="desc">The original sequence is shown in the top row. The lower row retains a4 and every later term in the same order; a1, a2 and a3 are not in this tail.</desc>
<style>text{font:18px Georgia,serif;fill:#35445b;text-anchor:middle}.he{font:16px Arial,sans-serif;direction:rtl;unicode-bidi:plaintext;text-anchor:middle}.sub{font-size:12px;baseline-shift:sub}</style>
