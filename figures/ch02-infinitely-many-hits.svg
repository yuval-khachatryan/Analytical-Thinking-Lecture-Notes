<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 240" role="img" aria-labelledby="title desc">
<title id="title">Infinitely many hits at L do not imply convergence to L</title>
<desc id="desc">Odd-indexed terms equal L, while even-indexed terms equal a fixed M greater than L. A narrow neighborhood of L excludes every term equal to M.</desc>
<style>text{font:16px Georgia,serif;text-anchor:middle;fill:#38445b}line,path{stroke-linecap:round}</style>
