/* Interactive widgets embedded from widgets/<chapter>/*.html.
   They live in an iframe so their CSS (which styles body/table/button
   unscoped) cannot leak into the page, and so several copies on one
   page do not collide on element ids. The height below is a first guess;
   each widget posts its real height and the listener at the bottom of this
   file applies it. */
iframe.widget-frame {
  display: block;
  width: 100%;
  height: 440px;      /* replaced by the widget's own reported height */
  border: 0;          /* the widget draws its own frame */
  background: transparent;
  margin: 1.2rem 0 0;
}
/* Inside a .thmsim box the frame sits flush; the box supplies the padding. */
.thmbox-simulation iframe.widget-frame { margin: 0.5rem 0 0.2rem; }
.thmbox {
  border-inline-start: 4px solid #9ca3af;
  background: #fafafa;
  border-radius: 4px;
  padding: 0.6rem 1rem;
  margin: 1rem 0;
}
.thmbox > :first-child { margin-top: 0; }
.thmbox > :last-child { margin-bottom: 0; }
.thmbox-definition  { border-color: #4f46e5; background: #eef2ff; }
.thmbox-theorem     { border-color: #0d9488; background: #f0fdfa; }
.thmbox-proposition { border-color: #0d9488; background: #f0fdfa; }
.thmbox-lemma       { border-color: #14b8a6; background: #f0fdfa; }
.thmbox-corollary   { border-color: #14b8a6; background: #f0fdfa; }
.thmbox-example     { border-color: #ea580c; background: #fff7ed; }
/* Question: kin to .thmbox-example, so same hue family, one shade deeper. Its
   solution reuses the proof's slate — a solution is to a question what a proof
   is to a theorem, and the reader already reads that grey as "the working". */
.thmbox-question    { border-color: #9333ea; background: #faf5ff; }
.thmbox-solution    { border-color: #64748b; background: #f8fafc; }
.thmbox-solution > p:first-child > strong { font-weight: 600; color: #64748b; }
.thmbox-simulation  { border-color: #7c3aed; background: #f7f5ff; }
.thmbox-proof       { border-color: #64748b; background: #f8fafc; }
.thmbox-proof > p:first-child > strong { font-weight: 600; color: #64748b; }
.thmbox-remark      { border-color: #94a3b8; background: #f8fafc; }
.thmbox-remark > p:first-child > strong { font-weight: 600; color: #64748b; }
/* Warning (.thmwarn, red) and key point (.thmkey, blue): ported from the BGU book with
   this course's own hues. Thicker edge, because they mark what students must not miss. */
.thmbox-warning     { border-color: #e11d48; border-inline-start-width: 6px; background: #fff1f2; }
.thmbox-warning > p:first-child > strong { font-weight: 700; color: #be123c; }
.thmbox-key-point   { border-color: #0891b2; border-inline-start-width: 6px; background: #ecfeff; }
.thmbox-key-point > p:first-child > strong { font-weight: 700; color: #0e7490; }
/* Role badges (icon="..."), HTML only. */
.thmbox[class*="thmicon-"] > p:first-child > strong::before {
  margin-inline-end: 0.35em;
  font-size: 1.45em;
  vertical-align: -0.18em;
}
.thmbox.thmicon-method     > p:first-child > strong::before { content: "🛠️"; }
.thmbox.thmicon-calc       > p:first-child > strong::before { content: "🧮"; }
.thmbox.thmicon-rule       > p:first-child > strong::before { content: "✅"; }
.thmbox.thmicon-convention > p:first-child > strong::before { content: "🤝"; }
.thmbox.thmicon-idea       > p:first-child > strong::before { content: "💡"; }
/* ---------------------------------------------------------------------------
   Math must never inherit the page's RTL direction. <html dir="rtl"> makes the
   whole document a right-to-left bidi context, and two things go wrong inside it:

   1. The renderer's own output boxes lay out right-to-left, so a formula mixed
      into a Hebrew sentence reads backwards.
   2. Until MathJax runs, the page literally contains the raw source \( ... \).
      If the CDN is slow or unreachable that source is what stays on screen, and
      the bidi algorithm reorders it -- the same failure the widgets have with
      KaTeX (see mathrender.js).

   `unicode-bidi: isolate` makes every formula its own bidi context: it can
   neither be reordered by the Hebrew around it nor reorder that Hebrew.
   --------------------------------------------------------------------------- */
span.math,
mjx-container,
.katex,
.katex-display {
  direction: ltr;
  unicode-bidi: isolate;
}
mjx-container *,
.katex * {
  direction: ltr;
}

/* Keep inline math on one line. This backs up the MathJax linebreak config
   below; see the comment there for why v4 needs it at all. Display math is
   left alone -- MathJax gives it its own scroll box. */
mjx-container:not([display="true"]),
.katex:not(.katex-display) {
  white-space: nowrap;
}

/* Optional box (.optional): foldable, collapsed by default; same gray look as .extra,
   but the gray bar is the clickable <summary>. */
details.thmoptional {
  border: 1px solid #9ca3af;
  border-radius: 0;
  margin: 1.5rem 0;
  background: #ffffff;
  overflow: hidden;
}
details.thmoptional > summary {
  background: #d1d5db;
  color: #374151;
  font-weight: 700;
  padding: 0.45rem 0.8rem;
  cursor: pointer;
}
details.thmoptional[open] > summary { border-bottom: 1px solid #9ca3af; }
details.thmoptional > .optional { padding: 0.7rem 0.9rem; }
details.thmoptional > .optional > :first-child { margin-top: 0; }
details.thmoptional > .optional > :last-child { margin-bottom: 0; }
/* .foldable: hidden calculations / derivations. Distinct from .optional (which is a
   whole gray-boxed aside) — this is a light inline disclosure inside the running text. */
details.thmfoldable {
  margin: 1rem 0;
  border-inline-start: 3px solid #cbd5e1;
  padding-inline-start: 0.8rem;
}
details.thmfoldable > summary {
  cursor: pointer;
  color: #475569;
  font-weight: 600;
}
details.thmfoldable[open] > summary { margin-bottom: 0.5rem; }
details.thmcollapse { margin: 1rem 0; }
details.thmcollapse > summary {
  cursor: pointer;
  font-weight: 700;
  color: #475569;
  padding: 0.2rem 0;
}
details.thmcollapse[open] > summary { margin-bottom: 0.4rem; }
/* Enrichment box (.extra): non-foldable, gray box; the section heading becomes a gray
   header bar. Quarto merges the div into <section class="... extra">, so we style .extra. */
.extra {
  border: 1px solid #9ca3af;
  border-radius: 0;
  margin: 1.5rem 0;
  background: #ffffff;
  padding: 0.7rem 0.9rem;
}
.extra > h2, .extra > h3, .extra > .extra-title {
  background: #d1d5db;
  color: #374151;
  font-size: 1.25rem;
  font-weight: 700;
  margin: -0.7rem -0.9rem 0.8rem;
  padding: 0.45rem 0.8rem;
  border-bottom: 1px solid #9ca3af;
}
.extra > :last-child { margin-bottom: 0; }

/* ---- interactive lecture notes ------------------------------------------
   The look follows the Ramat Gan Discrete Mathematics notes (their
   _styles.html, the .bk-* rules). */

/* Pictures floated inside a box stay inside it. */
.thmbox { display: flow-root; }
/* Self-check (.thmchk) and section summary (.thmsummary): unnumbered. */
.thmbox-self-check { border-color: #db2777; background: #fdf2f8; }
.thmbox-self-check > p:first-child > strong::before { content: "🎯"; margin-inline-end: .4em; }
.thmbox-summary { border-color: #0f766e; background: #f0fdfa; }
.thmbox-summary > p:first-child > strong::before { content: "📋"; margin-inline-end: .4em; }

/* Small tables (values, intervals, transformations): compact and centred, and on a
   phone they scroll inside their own box instead of pushing the page sideways. */
main table.table { width: auto; min-width: 10rem; margin-left: auto; margin-right: auto; }
main table.table th, main table.table td { padding: 0.3rem 1rem; text-align: center; }
/* A table of blanks has many narrow columns: keep it inside its box. */
main .fill table.table th, main .fill table.table td { padding: 0.3rem 0.45rem; }
main .fill table.table { max-width: 100%; }
@media (max-width: 600px) {
  main table.table { display: block; width: fit-content; max-width: 100%; overflow-x: auto; }
  main table.table th, main table.table td { padding: 0.25rem 0.45rem; }
}

/* An answer inside an example or question, revealed on a click (.lecture-answer):
   a plain link-coloured summary next to the grey edge of .thmfoldable. */
details.lecture-answer { margin: .45rem 0 1rem; }
details.lecture-answer > summary { color: #4338ca; cursor: pointer; font-weight: 600; }
details.lecture-answer > summary:focus-visible { outline: 3px solid #f59e0b; outline-offset: 2px; }
details.lecture-answer > :last-child { margin-bottom: 0; }
/* An exercise's solution (.thmsol .foldable): its box has its own edge. */
details.lecture-solution { margin-top: -.4rem; }
@media print {
  details.lecture-answer::details-content { content-visibility: visible; }
  details.lecture-answer > :not(summary) { display: block !important; }
}

/* Click-to-answer quiz (.quiz in the source -> .tf-quiz): the explanation
   (.tf-why) appears once the reader has answered. Without JS it simply shows. */
.tf-quiz .tf-opt { min-height: 44px; max-width: 100%; margin: 0 0 .35rem .5rem; }
.tf-quiz .tf-opt:focus-visible { outline: 3px solid #4338ca; outline-offset: 2px; }
.tf-quiz.tf-js:not(.tf-answered) .tf-why { display: none; }
.tf-quiz .tf-why {
  margin-top: .4rem; padding: .4rem .7rem; border-radius: 8px;
  background: #f8fafc; border: 1px solid #e2e8f0;
}
.tf-quiz .tf-why > :last-child { margin-bottom: 0; }
.tf-quiz .tf-feedback:empty { display: none; }

/* A small label in front of a hint or a step ("רמז", "צעד 2 מתוך 4"). */
.solve > .hint::before, .solve > .step::before,
.fill > .hint::before, .derive > .hint::before {
  display: inline-block; margin-inline-end: .5rem; padding: 0 .5rem; border-radius: 999px;
  font-size: .85em; font-weight: 700; background: #e2e8f0; color: #334155;
}
.solve > .hint::before, .fill > .hint::before, .derive > .hint::before {
  content: "רמז"; background: #fde68a; color: #92400e;
}

/* Step-by-step solution (.solve): hints and steps revealed one at a time. */
.solve {
  counter-reset: solvestep solvehint;
  border-inline-start: 4px solid #64748b; background: #f8fafc; border-radius: 4px;
  padding: .5rem 1rem; margin: .6rem 0 1.2rem;
}
.solve > .hint, .solve > .step {
  margin: .45rem 0; padding: .45rem .7rem; border-radius: 8px;
  background: #fff; border: 1px solid #e2e8f0;
}
.solve > .hint { border-style: dashed; border-color: #d97706; background: #fffbeb; }
.solve > .hint::before { counter-increment: solvehint; }
.solve.solve-many-hints > .hint::before { content: "רמז " counter(solvehint); }
.solve > .step::before { counter-increment: solvestep; content: "צעד " counter(solvestep); }
.solve > .step[data-of]::before { content: "צעד " counter(solvestep) " מתוך " attr(data-of); }
.solve > .hint > p:first-child, .solve > .step > p:first-child { display: inline; }
.solve > .hint > :last-child, .solve > .step > :last-child { margin-bottom: 0; }
.solve .solve-hidden { display: none !important; }
.solve-bar { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem; margin: .2rem 0 .5rem; }
.solve-bar button[hidden] { display: none; }
/* Buttons: the .bk-btn look of the Ramat Gan notes. */
.solve-bar button, .ix-btn {
  min-height: 40px; padding: .3rem .9rem; border: 1px solid #94a3b8; border-radius: 8px;
  background: #fff; color: inherit; font: inherit; font-size: .95em; cursor: pointer;
}
.solve-bar button:hover:not(:disabled), .ix-btn:hover:not(:disabled) { background: #f1f5f9; }
.solve-bar button:disabled, .ix-btn:disabled { opacity: .5; cursor: default; }
.solve-bar button.solve-main, .ix-btn.ix-main {
  background: #4f46e5; border-color: #4f46e5; color: #fff; font-weight: 700;
}
.solve-bar button.solve-main:hover:not(:disabled), .ix-btn.ix-main:hover:not(:disabled) { background: #4338ca; }
.solve-bar button.solve-quiet, .ix-btn.ix-quiet { color: #475569; }
.solve-bar button:focus-visible, .ix-btn:focus-visible, .ix-key:focus-visible,
.blank-input:focus-visible, .ord-card:focus-visible {
  outline: 3px solid #f59e0b; outline-offset: 2px;
}

/* A new term where it is defined, and a one-line rule worth remembering. */
.term {
  white-space: nowrap; color: #6b21a8; background: #f3e8ff; border-radius: .22em; padding: .04em .2em;
  font-weight: 700; box-decoration-break: clone; -webkit-box-decoration-break: clone;
}
.key-rule {
  color: #075985; background: #e0f2fe; font-weight: 700; padding: .08em .25em;
  border-radius: .2em; box-decoration-break: clone; -webkit-box-decoration-break: clone;
}
/* "What we are doing" note at the top of a section: a sticky note, unlike any box. */
.lead {
  font-size: 1.05em; color: #1e293b; background: #fefce8;
  border: 1px solid #fde68a; padding: .55rem .9rem; border-radius: 10px;
  margin: .6rem 0 1rem;
}
.lead > :last-child { margin-bottom: 0; }
@media print {
  .term, .key-rule { color: #111; background: transparent; }
  .solve .solve-hidden { display: block !important; }
  .solve-bar { display: none; }
}

/* ---- the reader writes answers (assets/interactive.js) -------------------- */
/* A run of math and blanks is one LTR formula inside the RTL sentence. */
.fill-ltr { direction: ltr; unicode-bidi: isolate; display: inline-block; white-space: nowrap; }
/* What the reader types (`2/3`, `[0,5)`, ...) is LTR inside the Hebrew sentence. */
p code, li code, td code, .ix-msg code { direction: ltr; unicode-bidi: isolate; white-space: nowrap; }
.eqline { text-align: center; margin: .5rem 0; }
.eqline > p { margin: 0; }
span.blank { white-space: nowrap; }
span.blank:not(.blank-ready) { text-decoration: underline; text-underline-offset: .25em; }
.blank-input {
  font: inherit; font-size: .95em; direction: ltr; text-align: center;
  padding: .05rem .35rem; margin: 0 .15rem; min-width: 3.2em;
  border: 1px solid #94a3b8; border-radius: 6px; background: #fff;
  box-sizing: content-box;
}
.blank-input:focus { border-color: #4f46e5; }
/* MathLive fields are the input itself, not a preview below an ASCII field. */
math-field.blank-input { display: inline-block; max-width: 100%; min-height: 2.4rem; font-size: 1.12em; vertical-align: middle; box-sizing: border-box; padding: .15rem .35rem; border-radius: 8px; --caret-color: #4f46e5; --selection-background-color: #e0e7ff; --placeholder-color: #64748b; --contains-highlight-background-color: #eef2ff; }
math-field.blank-input[hidden] { display: none !important; }
math-field.blank-input:focus-within { border-color: #4f46e5; outline: 3px solid #fbbf24; outline-offset: 2px; }
math-field.blank-input[aria-invalid="true"] { border-color: #b91c1c; }
math-field::part(menu-toggle) { display: none; }
math-field::part(virtual-keyboard-toggle) { color: #64748b; }
.pw math-field.pw-input { width: 100%; min-width: 0; }
.ix-frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: .78em; line-height: 1.1; }
.ix-frac > :first-child { border-bottom: 1px solid currentColor; padding: 0 .3em; }
.ix-frac > :last-child { padding: 0 .3em; }
.pw > .ix-keys { display: none; }
.pw:focus-within > .ix-keys { display: flex; }
.ix-key:focus-visible { outline: 3px solid #fbbf24; outline-offset: 2px; }
td .blank-input, th .blank-input { min-width: 2.4em; padding: .05rem .2rem; }
.fill table { margin-inline: auto; }
span.blank.ok .blank-input { border-color: #16a34a; background: #f0fdf4; }
span.blank.bad .blank-input { border-color: #e11d48; background: #fff1f2; }
.blank-mark { font-weight: 700; font-size: .9em; }
span.blank.ok .blank-mark { color: #15803d; }
span.blank.bad .blank-mark { color: #be123c; }
span.blank.warn .blank-input { border-color: #d97706; background: #fffbeb; }
span.blank.warn .blank-mark { color: #b45309; }
.blank-answer { background: #fef9c3; border-radius: 4px; padding: 0 .25em; }
.ix-hidden { display: none !important; }
.ix-panel { margin: .35rem 0 .8rem; }
.ix-panel .ix-keys { display: none; }
.ix-panel.ix-active .ix-keys { display: flex; }
.ix-keys { flex-wrap: wrap; gap: .3rem; margin: .3rem 0; direction: ltr; justify-content: flex-end; }
/* Keypad: the .bk-key look of the Ramat Gan notes. */
.ix-key {
  min-width: 40px; min-height: 40px; padding: 0 .4rem; cursor: pointer;
  border: 1px solid #94a3b8; border-radius: 8px; background: #fff; color: #1e293b;
  font: 1.1rem "Cambria Math", "STIX Two Math", serif;
}
.ix-key:hover { background: #eef2ff; }
.ix-bar { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem; margin: .2rem 0 .5rem; }
/* Feedback: the .bk-msg look (a coloured edge, a light fill). */
.ix-msg:empty { display: none; }
.ix-msg {
  margin: .3rem 0; padding: .45rem .8rem; border-radius: 8px; font-size: .95em;
  border-inline-start: 4px solid #64748b; background: #fff;
}
.ix-msg.ix-good { border-color: #15803d; background: #dcfce7; }
.ix-msg.ix-bad { border-color: #b91c1c; background: #fee2e2; }
.ix-msg.ix-warn { border-color: #d97706; background: #fef3c7; }
.ix-msg.ix-info { border-color: #1d4ed8; background: #dbeafe; }
/* Under an input: what has been typed so far, as a formula (no words). Dimmed while
   the input is still unfinished and only its beginning can be read. */
.thmbox-terminology { border-color: #0369a1; background: #f0f9ff; }
.thmbox-terminology > p:first-child > strong { color: #075985; }
.thmbox-terminology > p:first-child > strong::before { content: "📖"; display: inline-block; margin-inline-end: .4em; }
.pw-paper { margin: .5rem 0; background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; }
.pw-row { padding: .5rem; border-bottom: 1px solid #e2e8f0; }
.pw-row:last-child { border-bottom: 0; }
.pw-entry { display: flex; gap: .4rem; direction: ltr; }
.pw-entry .pw-input { flex: 1; min-width: 0; width: 100%; text-align: left; }
.pw-preview { overflow-x: auto; margin-top: .2rem; color: #475569; }
.pw-preview:empty { display: none; }
.pw-start, .pw-example { direction: ltr; text-align: center; overflow-x: auto; padding: .4rem; }
.pw-solution { margin-top: .6rem; }
.pw-solution summary { cursor: pointer; color: #4338ca; }
.pw-solution > .step { margin: .3rem 0 .8rem; }
.pw-hints:not(:empty) { background: #fffbeb; border-inline-start: 3px solid #d97706; padding: .5rem; }
.ix-preview:empty { display: none; }
.ix-preview { font-size: 1.05em; color: #1e293b; margin: .25rem 0; }
.ix-preview.ix-preview-partial { opacity: .5; }
.ix-or { margin: 0 .35em; font-weight: 600; }
.fill > .hint, .derive > .hint {
  margin: .4rem 0; padding: .4rem .7rem; border-radius: 8px;
  border: 1px dashed #d97706; background: #fffbeb;
}

<script>
/* ---------------------------------------------------------------------------
   MathJax line breaking.

   Quarto now loads mathjax@4, and v4 switched on automatic line breaking that
   v3 did not do:

     * inline math may be broken at a relation or a binary operator, so a short
       formula such as \( \phi : U \to V \) comes out split after the U;
     * display math wider than the column is broken instead of being left to
       run on.

   Inside an RTL paragraph a break in the middle of a formula does not read as
   a wrap, it reads as a mistake. So turn the AUTOMATIC breaking off:
   `linebreaks.inline = false` for inline math, and `displayOverflow = scroll`
   so that over-wide display math gets a scroll box rather than being chopped.

   Breaks we wrote ourselves are unaffected: `\\` inside aligned/cases/matrix
   still starts a new row, which is the "unless specifically required" case.

   Both `output` and `chtml` are set because v4 accepts these keys on the
   generic output block and on the specific output jax, and tex-chtml.js loads
   CHTML. The more specific one wins; setting both costs nothing.

   This has to run before the MathJax script does. That script carries `defer`,
   so it runs after parsing, while this inline script runs during parsing --
   hence anywhere in the head is early enough.

   The colour package is loaded up front. interactive.js colours the values the
   reader filled in (\color{#15803d}) and typesets synchronously. Left to the
   autoloader, the first \color triggers a download; a second typeset while it
   is still on its way finds \color undefined and stops at the "#" ("You can't
   use 'macro parameter character #' in math mode").
   --------------------------------------------------------------------------- */
window.MathJax = {
  loader: { load: ["[tex]/color"] },
  tex: { packages: { "[+]": ["color"] } },
  output: {
    displayOverflow: "scroll",
    linebreaks: { inline: false }
  },
  chtml: {
    displayOverflow: "scroll",
    linebreaks: { inline: false }
  }
};
</script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  document.querySelectorAll(".tf-quiz").forEach(function (quiz) {
    var correct = quiz.getAttribute("data-correct");
    var feedback = quiz.querySelector(".tf-feedback");
    var hasWhy = !!quiz.querySelector(".tf-why");
    quiz.classList.add("tf-js");          // the explanation now waits for an answer
    quiz.querySelectorAll(".tf-opt").forEach(function (btn) {
      btn.addEventListener("click", function () {
        quiz.querySelectorAll(".tf-opt").forEach(function (b) {
          b.classList.remove("correct", "incorrect");
        });
        quiz.classList.add("tf-answered");
        if (btn.getAttribute("data-val") === correct) {
          btn.classList.add("correct");
          if (feedback) feedback.textContent = "✓ נכון!";
        } else {
          btn.classList.add("incorrect");
          if (feedback) feedback.textContent = hasWhy
            ? "✗ לא בדיוק. קראו את ההסבר."
            : "✗ לא מדויק — נסו שוב, או פתחו את הפתרון.";
        }
      });
    });
  });
});

<script>
/* Step-by-step solutions (.solve): the hints and the steps are revealed one at a
   time. The button bar always sits right after the last revealed hint or step, where
   the next one will appear. Inside a proof box, "כל הפתרון" reads "כל ההוכחה".
   Without JavaScript everything simply stays visible. */
document.addEventListener("DOMContentLoaded", function () {
  document.querySelectorAll(".solve").forEach(function (box) {
    var kids = Array.prototype.slice.call(box.children);
    var hints = kids.filter(function (c) { return c.classList.contains("hint"); });
    var steps = kids.filter(function (c) { return c.classList.contains("step"); });
    if (!hints.length && !steps.length) return;
    var shownH = 0, shownS = 0;
    // Labels in front of the hints and steps ("רמז 2", "צעד 3 מתוך 5"): see the CSS.
    if (hints.length > 1) box.classList.add("solve-many-hints");
    steps.forEach(function (s) { s.setAttribute("data-of", steps.length); });
    var bar = document.createElement("div");
    bar.className = "solve-bar";
    function button(label, cls, action) {
      var b = document.createElement("button");
      b.type = "button"; b.textContent = label;
      if (cls) b.className = cls;
      b.addEventListener("click", function () { action(); sync(); });
      bar.appendChild(b); return b;
    }
    var bHint = hints.length ? button("רמז", "", function () { shownH++; }) : null;
    var bStep = steps.length ? button("הצעד הבא", "solve-main", function () { shownS++; }) : null;
    var inProof = !!box.closest(".thmbox-proof");
    var allLabel = box.getAttribute("data-all") || (inProof ? "כל ההוכחה" : "כל הפתרון");
    var doneLabel = inProof ? "ההוכחה כולה מוצגת" : "הפתרון כולו מוצג";
    var bAll  = button(allLabel, "solve-quiet", function () { shownH = hints.length; shownS = steps.length; });
    var parts = kids.filter(function (c) { return c.classList.contains("hint") || c.classList.contains("step"); });
    var bHide = button("הסתרה", "solve-quiet", function () { shownH = 0; shownS = 0; });
    function sync() {
      hints.forEach(function (h, i) { h.classList.toggle("solve-hidden", i >= shownH); });
      steps.forEach(function (s, i) { s.classList.toggle("solve-hidden", i >= shownS); });
      if (bHint) {
        bHint.disabled = shownH >= hints.length;
        bHint.textContent = "רמז (" + shownH + "/" + hints.length + ")";
      }
      if (bStep) {
        bStep.disabled = shownS >= steps.length;
        bStep.textContent = shownS >= steps.length ? doneLabel
          : shownS === 0 ? "הצעד הראשון (1/" + steps.length + ")"
          : "הצעד הבא (" + (shownS + 1) + "/" + steps.length + ")";
      }
      bAll.disabled = shownS >= steps.length && shownH >= hints.length;
      bHide.hidden = shownS === 0 && shownH === 0;
      var shown = parts.filter(function (c) { return !c.classList.contains("solve-hidden"); });
      var last = shown[shown.length - 1];
      if (last) box.insertBefore(bar, last.nextSibling);
      else box.insertBefore(bar, parts[0]);
    }
    sync();
  });
  // Print everything: open every answer before printing, restore afterwards.
  var answers = Array.prototype.slice.call(document.querySelectorAll("details.lecture-answer"));
  var before = null;
  window.addEventListener("beforeprint", function () {
    before = answers.map(function (a) { return a.open; });
    answers.forEach(function (a) { a.open = true; });
  });
  window.addEventListener("afterprint", function () {
    if (before) answers.forEach(function (a, i) { a.open = before[i]; });
    before = null;
  });
});
</script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  function normSet(str) {
    if (!str) return [];
    return Array.from(new Set(
      str.split(/[\s,;]+/).filter(function (s) { return s.length; }).map(Number)
    )).filter(function (n) { return !Number.isNaN(n); }).sort(function (a, b) { return a - b; });
  }
  function eqSet(a, b) {
    if (a.length !== b.length) return false;
    for (var i = 0; i < a.length; i++) { if (a[i] !== b[i]) return false; }
    return true;
  }
  document.querySelectorAll(".set-quiz").forEach(function (q) {
    var answer = normSet(q.getAttribute("data-answer"));
    var input = q.querySelector(".set-input");
    var feedback = q.querySelector(".set-feedback");
    var btn = q.querySelector(".set-check");
    function check() {
      input.classList.remove("correct", "incorrect");
      if (eqSet(normSet(input.value), answer)) {
        input.classList.add("correct");
        if (feedback) feedback.textContent = "✓ נכון!";
      } else {
        input.classList.add("incorrect");
        if (feedback) feedback.textContent = "✗ נסו שוב";
      }
    }
    if (btn) btn.addEventListener("click", check);
    if (input) input.addEventListener("keydown", function (e) { if (e.key === "Enter") check(); });
  });
});
</script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  // Evaluate one entered term as arithmetic (whitelisted chars only: digits + - * / ^ ( ) . )
  function evalTerm(s) {
    s = String(s).trim();
    if (!s) return null;
    if (!/^[0-9+\-*/^().\s]+$/.test(s)) return null;
    try {
      var v = Function('"use strict"; return (' + s.replace(/\^/g, "**") + ');')();
      return (typeof v === "number" && isFinite(v)) ? v : null;
    } catch (e) { return null; }
  }
  function parseSeq(str) { return String(str || "").split(",").map(evalTerm); }
  function eqSeq(a, b) {
    if (a.length !== b.length) return false;
    for (var i = 0; i < a.length; i++) {
      if (a[i] == null || b[i] == null || Math.abs(a[i] - b[i]) > 1e-9) return false;
    }
    return true;
  }
  document.querySelectorAll(".seq-quiz").forEach(function (q) {
    var answer = parseSeq(q.getAttribute("data-answer"));
    var input = q.querySelector(".seq-input");
    var feedback = q.querySelector(".seq-feedback");
    var btn = q.querySelector(".seq-check");
    function check() {
      input.classList.remove("correct", "incorrect");
      if (eqSeq(parseSeq(input.value), answer)) {
        input.classList.add("correct");
        if (feedback) feedback.textContent = "✓ נכון!";
      } else {
        input.classList.add("incorrect");
        if (feedback) feedback.textContent = "✗ נסו שוב";
      }
    }
    if (btn) btn.addEventListener("click", check);
    if (input) input.addEventListener("keydown", function (e) { if (e.key === "Enter") check(); });
  });
});
</script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  // Build n -> value from a formula in n (whitelisted: digits, n, + - * / ^ ! ( ) . )
  function makeFormula(s) {
    s = String(s || "").trim();
    if (!s || !/^[0-9n+\-*/^!().\s]+$/.test(s)) return null;
    s = s.replace(/(\d)\s*([n(])/g, "$1*$2")             // 2n, 2(  -> 2*n, 2*(
         .replace(/([n)])\s*([n(])/g, "$1*$2")           // )n, )(, n(  -> insert *
         .replace(/(\([^()]*\)|\d+|n)!/g, "fact($1)")    // n!, 5!, (n+1)!  -> fact(...)
         .replace(/\^/g, "**");
    try {
      var f = Function("n", '"use strict"; var fact=function(k){k=Math.round(k);var r=1;for(var i=2;i<=k;i++)r*=i;return r;}; return (' + s + ");");
      var t = f(1);
      return (typeof t === "number" && isFinite(t)) ? f : null;
    } catch (e) { return null; }
  }
  function parseTargets(str) {
    return String(str || "").split(",").map(function (t) {
      t = t.trim();
      if (!/^-?[0-9]+(?:\/[0-9]+)?$/.test(t)) return NaN;
      var p = t.split("/");
      return p.length === 2 ? Number(p[0]) / Number(p[1]) : Number(p[0]);
    });
  }
  document.querySelectorAll(".formula-quiz").forEach(function (q) {
    var targets = parseTargets(q.getAttribute("data-answer"));
    var input = q.querySelector(".seq-input");
    var feedback = q.querySelector(".seq-feedback");
    var btn = q.querySelector(".seq-check");
    function check() {
      input.classList.remove("correct", "incorrect");
      var f = makeFormula(input.value), ok = !!f;
      for (var i = 0; ok && i < targets.length; i++) {
        var v; try { v = f(i + 1); } catch (e) { ok = false; break; }
        if (typeof v !== "number" || !isFinite(v) || Math.abs(v - targets[i]) > 1e-9) ok = false;
      }
      if (ok) {
        input.classList.add("correct");
        if (feedback) feedback.textContent = "✓ נכון!";
      } else {
        input.classList.add("incorrect");
        if (feedback) feedback.textContent = "✗ נסו שוב";
      }
    }
    if (btn) btn.addEventListener("click", check);
    if (input) input.addEventListener("keydown", function (e) { if (e.key === "Enter") check(); });
  });
});
</script>
<script>
// Widgets embedded from widgets/<chapter>/ report their own height, so the
// iframe does not need a hard-coded one (which breaks on narrow screens,
// where the control panel stacks above the plot).
window.addEventListener("message", function (e) {
  var d = e.data;
  if (!d || d.type !== "widget-height" || typeof d.height !== "number") return;
  var frames = document.querySelectorAll("iframe.widget-frame");
  for (var i = 0; i < frames.length; i++) {
    if (frames[i].contentWindow === e.source) {
      frames[i].style.height = Math.max(320, Math.min(2000, d.height)) + "px";
      return;
    }
  }
});
</script>
