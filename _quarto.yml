project:
  type: book
  output-dir: _book
  # The visualisers are standalone HTML pages under widgets/<chapter>/ pulled
  # into the page with an <iframe>. Quarto only copies files it knows about, so
  # the folder has to be declared here or the iframes 404 in _book/.
  resources:
    - widgets/**
    - assets/**
  # One table of contents in the right sidebar (chapters > sections >
  # subsections), as in the Ramat Gan notes: this embeds every chapter's TOC in
  # each page, and assets/navigation.js builds the tree.
  post-render:
    - node tools/build-navigation.mjs

book:
  title: "חשיבה אנליטית — מערכי הרצאה"
  site-url: "https://yuval-khachatryan.github.io/Analytical-Thinking-Lecture-Notes"
  repo-url: "https://github.com/yuval-khachatryan/Analytical-Thinking-Lecture-Notes"
  author: "ד״ר יובל חצ׳טריאן-רזיאל"
  output-file: "Analytical-Thinking-Lecture-Notes"
  search: true
  reader-mode: true
  chapters:
    - index.qmd
    - 01-Introduction.qmd
    - 02-Sequences.qmd

lang: he
dir: rtl
number-sections: true
number-depth: 3

crossref:
  chapters: true
  def-title: "הגדרה"
  exm-title: "דוגמה"
  thm-title: "משפט"
  prp-title: "טענה"

language:
  crossref-prp-prefix: "טענה"

filters:
  - theorem-numbering.lua
  - quarto

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 4
    toc-title: "סעיפי הפרק"
    # "left" is the sidebar side, which in RTL is the right; navigation.js then
    # merges the page TOC into the chapter list there.
    toc-location: left
    toc-expand: false
    code-fold: true
    include-in-header: _styles.html
  # HTML only: these are interactive notes. The xelatex PDF settings (RTL fixes,
  # fonts, foldable/optional boxes) are kept in
  # ../Archive/2026-11-01-before-fill-in-exercises/_quarto.yml for when a print
  # edition is wanted again.

jupyter: python3
