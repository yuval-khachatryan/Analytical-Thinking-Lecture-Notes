<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>הוכחתי! — האומנם?</title><link rel="stylesheet" href="limit-activities.css"><link rel="stylesheet" href="epsilon-game.css"></head>
<body><div class="w">
<div class="stages-heading"><strong>״הוכחתי!״ — האומנם?</strong><span id="progress" class="caption" aria-live="polite"></span></div>
<div id="stages" role="tablist" aria-label="שלבי המשחק"></div>
<section id="stage-panel" role="tabpanel" tabindex="0">
<p id="setup" class="setup"></p>
<p id="claim" class="caption">🤓 ״מצאתי רצועה שמכילה את כל האיברים מהאינדקס שבחרתי. זה מוכיח שמצאתי את הגבול, נכון?״</p>
<svg id="plot"></svg>
<div class="controls"><label>סף השגיאה <span class="m">ε</span><select id="epsilon" dir="ltr"></select></label><label>מתחילים באינדקס <span class="m">N</span><input id="index" type="number" min="1" max="10000000" value="1"></label><button id="check">בדיקת הזנב</button><button id="later">מתקדמים באינדקסים</button></div>
<p id="read" class="read" aria-live="polite"></p>
<p class="caption">כחול: בתוך הרצועה; אדום: על השפה או בחוץ. בציור רק חלק מהאיברים; הבדיקה נעזרת בנוסחת הסדרה כדי לבדוק את כל האיברים מהאינדקס שנבחר והלאה.</p>
<div id="conclusion" hidden>
<div class="controls answers"><label>האם המועמד הוא גבול הסדרה?<select id="verdict"><option value="">בחרו…</option><option value="yes">כן, זה הגבול</option><option value="no">לא, זה אינו הגבול</option></select></label><label>הנימוק<select id="reason"><option value="">בחרו נימוק…</option><option value="one">הצלחה עבור סף שגיאה אחד</option><option value="zero">השגיאה תמיד אפס</option><option value="all">אינדקס מתאים לכל סף שגיאה</option><option value="outside">איברים בחוץ בכל זנב</option><option value="single">איבר אחד בחוץ</option></select></label></div>
<p id="reason-detail" class="read" hidden></p>
<button id="answer-check">בדיקת התשובה והנימוק</button>
</div>
<p id="feedback" class="read" aria-live="polite" hidden></p>
<div class="controls footer"><button id="hint">רמז</button><button id="reveal">הצגת תשובה</button><button id="reset">מההתחלה בשלב הזה</button><button id="next" hidden>לשלב הבא ←</button></div>
</section>
</div><script src="../shared/autosize.js"></script><script src="limit-activities.js"></script><script src="epsilon-game.js"></script></body></html>
