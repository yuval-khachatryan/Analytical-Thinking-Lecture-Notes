<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>זנב הסדרה בהגדלה</title>
<link rel="stylesheet" href="limit-activities.css">
<style>#plot{max-width:720px;margin-inline:auto}#scale{min-width:4rem}#terms{text-align:center}.term-value{white-space:nowrap;margin-inline:.5rem}</style>
</head>
<body><div class="w">
<p class="heading m">a<sub>n</sub> = <span class="fr"><span>1</span><span>10<sup>n</sup></span></span> → 0</p>
<svg id="plot" viewBox="0 0 720 170" role="img" aria-label="איברי הסדרה על ישר המספרים בהגדלה"></svg>
<p id="terms" class="caption"></p>
<div class="controls"><label>הגדלה סביב <span class="m">L = 0</span><input id="zoom" type="range" min="0" max="8" step="1" value="0" aria-label="הגדלה סביב אפס"></label><output id="scale" class="m"></output></div>
<p id="read" class="read" aria-live="polite"></p>
<p id="outside" class="caption"></p>
<p class="caption">המספרים אינם משתנים בהגדלה. בכל תצוגה יש זנב שלם שנראה כאותה נקודה כמו אפס; הסימון ליד אפס מייצג גם את אינסוף האיברים שאינם מצוירים בנפרד.</p>
</div>
<script src="../shared/autosize.js"></script>
<script src="limit-activities.js"></script>
<script src="microscope.js"></script>
</body>
</html>
